<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>規範轉檢查清單</title>
<style>
:root{--bg:#fff;--ink:#16181d;--mute:#5b6070;--line:#e3e6ee;--navy:#1e3a5f;--red:#d23e48;--green:#1f8a5b}
@media (prefers-color-scheme:dark){:root{--bg:#1b1e27;--ink:#eef0f5;--mute:#9aa0ae;--line:#2c303c;--navy:#8fb3e0}}
body{margin:0;width:420px;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
header{padding:12px 14px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0}
.src{color:var(--mute);font-size:12px;margin-top:4px;word-break:break-all}
ol{margin:0;padding:8px 14px 8px 34px;max-height:380px;overflow:auto}
li{padding:6px 0;border-bottom:1px dashed var(--line)}
li label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
li.must{font-weight:700}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;color:#fff;background:var(--red);margin-left:4px;white-space:nowrap}
.tag.num{background:var(--navy)}
footer{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:6px 14px;background:var(--navy);color:#fff;cursor:pointer}
.empty{padding:20px 14px;color:var(--mute)}
#done{color:var(--green);font-weight:700;margin-left:auto}
</style>
</head>
<body>
<header>
  <h1>規範轉檢查清單</h1>
  <div class="src" id="src"></div>
</header>
<div id="list"></div>
<footer>
  <button id="copy">複製成文字</button>
  <span id="done"></span>
</footer>
<script src="checklist.js"></script>
<script src="popup.js"></script>
</body>
</html>
